name: Build Cross-Platform Executables

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TypeFlow-Windows.exe
            asset_name: TypeFlow-Windows.exe
          - os: macos-latest
            artifact_name: dist/TypeFlow
            asset_name: TypeFlow-macOS
          - os: ubuntu-latest
            artifact_name: dist/TypeFlow
            asset_name: TypeFlow-Linux

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --onefile --name TypeFlow-Windows app.py
        move dist\TypeFlow-Windows.exe ./

    - name: Build with PyInstaller (macOS / Linux)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconsole --onefile --name TypeFlow app.py

    - name: Upload Binary to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          TypeFlow-Windows.exe
          dist/TypeFlow
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}